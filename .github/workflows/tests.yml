name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Boundary gate (packages/README.md four rules). Root `tsc --noEmit` and
      # root `npm test` are NOT gates: pre-existing red across several packages
      # (earth-online-changelog, prototype-events-daemon, pi-project-manager
      # suites) — unblock those before wiring them here.
      - name: Dependency boundaries
        run: npx depcruise packages

      # Per-package runner in each package's own cwd: suites are cwd-sensitive
      # (bash-guards golden capture and P6 fixtures assume package cwd; the
      # package vitest.config.ts carries testTimeout/fileParallelism the root
      # run bypasses). Discovery is dynamic so new packages gate automatically.
      # Packages outside the vitest convention run natively (canonical run
      # commands live in each test file's header comment):
      #   modernize/pi-extension — node:test suite
      #   pi-agent-renew — self-running assertion script (process.exit at end)
      #   earth-online-changelog — node:test suites under src/ (need transform-types)
      #   pi-wt-lite — self-running .mjs scripts using node:module register stubs
      #     (vitest's module runner ignores the register hook and hits real peer deps)
      - name: Package tests
        run: |
          set -uo pipefail
          rc=0
          for d in packages/*/; do
            name=$(basename "$d")
            find "$d" -maxdepth 3 -name "*.test.*" -not -path "*/node_modules/*" | grep -q . || continue
            echo "::group::test $name"
            case "$name" in
              modernize)              (cd "$d/pi-extension" && node --test test/extension.test.js) || rc=$? ;;
              pi-agent-renew)         (cd "$d" && node --experimental-transform-types renew.test.ts) || rc=$? ;;
              earth-online-changelog) (cd "$d" && node --experimental-transform-types --test "src/**/*.test.ts") || rc=$? ;;
              pi-wt-lite)             (cd "$d" && for t in tests/*.test.mjs; do node "$t" || exit 1; done) || rc=$? ;;
              *)                      (cd "$d" && npx vitest run) || rc=$? ;;
            esac
            echo "::endgroup::"
          done
          exit $rc
