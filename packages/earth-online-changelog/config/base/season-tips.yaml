# Season Tips — Earth Online Changelog
# Buff/debuff flavor text pools for the World Update section.
# Each season must have >=5 buffs and >=5 debuffs.
# Each tip supports multiple languages via language keys (zh, en, etc.).
# The renderer picks the tip text matching the current locale.

spring:
  buffs:
    - zh: "🌱 万物复苏，所有种植/养育类活动产出 +10%"
      en: "🌱 Spring renewal: farming/raising output +10%"
    - zh: "🌸 花卉进入盛放期，观光类任务经验 +15%"
      en: "🌸 Blooming season: sightseeing quest XP +15%"
    - zh: "🦋 昆虫活动增多，捕虫类迷你游戏解锁"
      en: "🦋 Insect activity surges: bug-catching minigame unlocked"
    - zh: "🌿 草木萌发，采集类素材掉落率 +8%"
      en: "🌿 Fresh sprouts: gathering material drop rate +8%"
    - zh: "🐣 繁殖季到来，牧场动物产出翻倍"
      en: "🐣 Breeding season: ranch animal output doubled"
    - zh: "☀️ 日照渐长，户外任务体力消耗 -10%"
      en: "☀️ Longer daylight: outdoor quest stamina cost -10%"
  debuffs:
    - zh: "🌧️ 换季敏感，部分玩家获得喷嚏 DEBUFF"
      en: "🌧️ Seasonal allergies: some players get Sneezing DEBUFF"
    - zh: "🌫️ 大雾天气，户外能见度降低"
      en: "🌫️ Heavy fog: outdoor visibility reduced"
    - zh: "💨 春风吹又生，杂草生长速度翻倍"
      en: "💨 Spring winds: weed growth rate doubled"
    - zh: "🤧 花粉过敏高发，部分玩家行动速度 -5%"
      en: "🤧 Pollen allergy spike: movement speed -5%"
    - zh: "🌦️ 倒春寒预警，保暖不足将获得冻伤 DEBUFF"
      en: "🌦️ Cold snap warning: insufficient warmth grants Frostbite DEBUFF"
    - zh: "🐛 害虫苏醒，作物防护成本 +20%"
      en: "🐛 Pests awaken: crop protection cost +20%"

